name: Windows

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[win,dev]"

      - name: Run quality gate
        shell: pwsh
        run: .\scripts\check.ps1 -Python python
