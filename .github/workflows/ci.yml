name: CI

# Brief §6: core/ tests run anywhere; adapter/integration tests require
# Windows. Lint + type-check (ruff, mypy) on core/. The Ubuntu matrix
# leg is the fast feedback loop; the Windows leg is the soak that catches
# Win32-specific regressions (DPI signatures, RegisterHotKey, mouse hook).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + Type (Ubuntu, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Ruff
        run: ruff check windows_rectangle tests
      - name: Mypy (core only)
        run: mypy windows_rectangle/core

  test-core:
    name: Tests (Ubuntu — core + portable adapters)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      # Win32-specific tests skip themselves on non-Windows via sys.platform
      # guards or pytest.mark.skipif; everything else runs here.
      - name: Pytest
        run: pytest -q

  test-windows:
    name: Tests (Windows — full suite incl. Win32 adapters)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (incl. PySide6 + pywin32 extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,win]"
      - name: Pytest
        run: pytest -q
