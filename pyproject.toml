[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows_rectangle"
version = "0.1.0"
description = "A Rectangle-for-Windows window manager"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Windows Rectangle contributors" }]
dependencies = []

[project.scripts]
windows-rectangle = "windows_rectangle.__main__:main"

[project.optional-dependencies]
win = ["pywin32>=306", "PySide6>=6.6"]
build = ["pyinstaller>=6.11"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["apps/windows"]
include = ["windows_rectangle*"]

[tool.pytest.ini_options]
testpaths = ["apps/windows/tests"]
addopts = "-ra --strict-markers"
pythonpath = ["apps/windows"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# UP042 (StrEnum migration): switching `class X(str, Enum)` to StrEnum
# changes `str(X.MEMBER)` semantics — purely cosmetic to migrate; not
# worth the behaviour audit.
# E741 ambiguous-name on a 4-tuple unpack is fine.
ignore = ["UP042", "E741"]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed long expressive lines (assertion messages, table-driven
# parameter lists). F841 dropped — the only offender was the vestigial
# double-assign in test_dispatcher cleaned up in iter 52; if anyone needs
# to capture-for-clarity again, prefer a deliberate `_ = expr`.
"apps/windows/tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps/windows/windows_rectangle/core"]
