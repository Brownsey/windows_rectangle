[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows_rectangle"
version = "0.1.0"
description = "A Rectangle-for-Windows window manager"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Windows Rectangle contributors" }]
dependencies = []

[project.scripts]
windows-rectangle = "windows_rectangle.__main__:main"

[project.optional-dependencies]
win = ["pywin32>=306", "PySide6>=6.6"]
build = ["pyinstaller>=6.11"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["apps/windows"]
include = ["windows_rectangle*"]

[tool.pytest.ini_options]
testpaths = ["apps/windows/tests"]
addopts = "-ra --strict-markers"
pythonpath = ["apps/windows"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "apps/windows/windows_rectangle/core",
    "apps/windows/windows_rectangle/ports",
    "apps/windows/windows_rectangle/app.py",
    "apps/windows/windows_rectangle/adapters/json_config.py",
    "apps/windows/windows_rectangle/adapters/single_instance.py",
    "apps/windows/windows_rectangle/adapters/win_dpi.py",
]
